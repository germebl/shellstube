name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Grundsatz: Diese CI prüft GENAU das, was `make ci` prüft — plus den Herkunftsnachweis.
# Eine Prüfung, die nur hier läuft und nicht in `make ci`, führt dazu, dass Arbeit das
# eigene Tor besteht und an der CI scheitert. Neue Linter kommen deshalb immer in beides
# gleichzeitig, nie nur hierher.

jobs:
  dco:
    name: Herkunftsnachweis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Signed-off-by prüfen
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fehlt=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: '; then
              echo "::error::Commit $sha ohne Signed-off-by. Abhilfe: git commit --amend -s"
              fehlt=1
            fi
          done < <(git rev-list "$base".."$head")
          exit $fehlt

  ci:
    name: Prüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27', cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml
      - name: make ci
        run: make ci
