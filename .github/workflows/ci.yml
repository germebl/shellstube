name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Herkunftsnachweis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Signed-off-by prüfen
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: '; then
              echo "::error::Commit $sha ohne Signed-off-by. Abhilfe: git commit --amend -s"
              missing=1
            fi
          done < <(git rev-list "$base".."$head")
          exit $missing

  data:
    name: Daten prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml jsonschema yamllint
      - name: YAML-Form
        run: yamllint hardware/ catalog/ .github/
      - name: Hardwareliste gegen die Regeln
        run: python3 tools/check_hardware.py
      - name: Dienstkatalog gegen die Regeln
        run: python3 tools/check_catalog.py

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23', cache: true }
      - run: go build ./...
      - run: go test ./... -race -count=1
      - uses: golangci/golangci-lint-action@v6

  docs:
    name: Dokumentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@reviewdog
        with: { files: docs/de }
      - name: Tote Verweise
        run: |
          npx --yes markdown-link-check -q -c .github/link-check.json \
            $(git ls-files 'docs/**/*.md' '*.md')
